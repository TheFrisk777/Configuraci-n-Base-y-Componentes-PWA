<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="failGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Step 1: Petición / Cliente -->
  <g transform="translate(15, 30)">
    <rect width="100" height="70" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="50" y="28" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">CLIENTE</text>
    <text x="50" y="48" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="700">fetch()</text>
    <circle cx="50" cy="62" r="3" fill="#38bdf8" />
  </g>

  <!-- Arrow 1 to SW -->
  <line x1="115" y1="65" x2="148" y2="65" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
  <polygon points="148,61 155,65 148,69" fill="#38bdf8" />

  <!-- Step 2: Service Worker Interceptor -->
  <g transform="translate(155, 20)">
    <rect width="130" height="90" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
    <rect x="0" y="0" width="130" height="24" rx="14" fill="rgba(99, 102, 241, 0.2)" />
    <text x="65" y="16" fill="#a5b4fc" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">SERVICE WORKER</text>
    <text x="65" y="46" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="600">event.fetch</text>
    <text x="65" y="66" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">¿Está en Caché?</text>
    <text x="65" y="80" fill="#f43f5e" font-family="sans-serif" font-size="9" text-anchor="middle">Cache Miss ✗</text>
  </g>

  <!-- Arrow 2 to Network -->
  <line x1="285" y1="65" x2="330" y2="65" stroke="#6366f1" stroke-width="2" />
  <polygon points="330,61 337,65 330,69" fill="#6366f1" />

  <!-- Step 3: Network / Internet (Fail) -->
  <g transform="translate(337, 25)">
    <rect width="165" height="80" rx="12" fill="url(#cardBg)" stroke="#f43f5e" stroke-width="2" />
    <text x="82" y="24" fill="#f43f5e" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">RED EXTERNA (INTERNET)</text>
    <text x="82" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Pérdida de Conexión</text>
    <g transform="translate(52, 54)">
      <rect width="60" height="18" rx="9" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-width="1" />
      <text x="30" y="12" fill="#fecdd3" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="700">ERROR NET ✗</text>
    </g>
  </g>

  <!-- Curved Return Arrow: Catch block down to Fallback Interceptor -->
  <path d="M420 105 V165 H295" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="295,161 287,165 295,169" fill="#f43f5e" />
  <text x="360" y="155" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="700">.catch(error)</text>

  <!-- Step 4: Fallback Handler & Template Render -->
  <g transform="translate(65, 135)">
    <rect width="220" height="120" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="220" height="26" rx="14" fill="rgba(16, 185, 129, 0.2)" />
    <text x="110" y="17" fill="#6ee7b7" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">MANEJADOR FALLBACK OFFLINE</text>
    
    <text x="110" y="48" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Detección de recurso HTML:</text>
    <rect x="25" y="58" width="170" height="26" rx="6" fill="#1e293b" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <text x="110" y="75" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="600">caches.match('offline.html')</text>

    <text x="110" y="102" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Renderizado de plantilla personalizada ✓</text>
    <circle cx="110" cy="115" r="3" fill="#10b981" />
  </g>

  <!-- Arrow returning Fallback to Client -->
  <path d="M65 195 H40 V100" fill="none" stroke="#10b981" stroke-width="2" />
  <polygon points="36,105 40,97 44,105" fill="#10b981" />
  <text x="48" y="145" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="700" transform="rotate(-90 48,145)">Respuesta Fallback</text>

  <!-- Step 5: Visual Badge for "Modo Sin Conexión" UI -->
  <g transform="translate(320, 185)">
    <rect width="180" height="70" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <text x="90" y="24" fill="#c7d2fe" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">EXPERIENCIA DE USUARIO</text>
    <text x="90" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">Pantalla offline.html</text>
    <text x="90" y="58" fill="#94a3b8" font-family="sans-serif" font-size="9.5" text-anchor="middle">Sin error genérico de navegador</text>
  </g>
</svg>
