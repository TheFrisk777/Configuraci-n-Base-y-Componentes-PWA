<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <rect width="300" height="200" rx="16" fill="url(#bgBox)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Image Icon Frame with Slash -->
  <g transform="translate(110, 45)">
    <rect width="80" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="2.5" />
    <!-- Mountains in image icon -->
    <path d="M10 50 L30 30 L45 42 L60 25 L75 50 Z" fill="#334155" />
    <circle cx="25" cy="20" r="5" fill="#64748b" />
    <!-- Diagonal Slash line -->
    <line x1="-5" y1="65" x2="85" y2="-5" stroke="url(#roseAccent)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Offline Image Notice Text -->
  <text x="150" y="138" fill="#f1f5f9" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    IMAGEN NO DISPONIBLE OFFLINE
  </text>
  <text x="150" y="158" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" text-anchor="middle">
    Recurso de red interceptado por el Service Worker (Fallback)
  </text>

  <!-- Tag Pill -->
  <g transform="translate(112, 170)">
    <rect width="76" height="18" rx="9" fill="rgba(244, 63, 94, 0.15)" stroke="rgba(244, 63, 94, 0.5)" stroke-width="1" />
    <text x="38" y="12.5" fill="#fda4af" font-family="monospace" font-size="9" font-weight="600" text-anchor="middle">OFFLINE-IMG</text>
  </g>
</svg>
