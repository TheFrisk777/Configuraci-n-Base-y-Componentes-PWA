<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0b0f19" />
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="url(#logoGrad)" stroke-width="2" opacity="0.6" />
  <!-- Shield and Antenna Symbol for Offline Interceptor -->
  <path d="M50 18 L76 30 V52 C76 68 50 82 50 82 C50 82 24 68 24 52 V30 Z" fill="rgba(14, 165, 233, 0.12)" stroke="url(#logoGrad)" stroke-width="3" stroke-linejoin="round" />
  <!-- Disconnected / Interceptor Signal Symbol -->
  <path d="M40 46 A14 14 0 0 1 60 46" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <path d="M34 40 A22 22 0 0 1 66 40" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <circle cx="50" cy="54" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <path d="M42 66 L58 66" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
  <!-- Slash indicating fallback trigger -->
  <line x1="32" y1="68" x2="68" y2="32" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" opacity="0.9" />
</svg>
