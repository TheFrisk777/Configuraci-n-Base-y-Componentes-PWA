<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <!-- Cache Vault Grid -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="40" y1="20" x2="40" y2="220" />
    <line x1="120" y1="20" x2="120" y2="220" />
    <line x1="200" y1="20" x2="200" y2="220" />
    <line x1="280" y1="20" x2="280" y2="220" />
    <line x1="360" y1="20" x2="360" y2="220" />
    <line x1="20" y1="60" x2="380" y2="60" />
    <line x1="20" y1="120" x2="380" y2="120" />
    <line x1="20" y1="180" x2="380" y2="180" />
  </g>
  <!-- Central Cache Storage Icon -->
  <g transform="translate(130, 45)">
    <!-- Storage Box 1 -->
    <rect x="20" y="80" width="100" height="26" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="35" cy="93" r="4" fill="#10b981"/>
    <line x1="50" y1="93" x2="105" y2="93" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Storage Box 2 -->
    <rect x="20" y="45" width="100" height="26" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <circle cx="35" cy="58" r="4" fill="#06b6d4"/>
    <line x1="50" y1="58" x2="95" y2="58" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Storage Box 3 (Top) -->
    <rect x="20" y="10" width="100" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <circle cx="35" cy="23" r="4" fill="#a855f7"/>
    <line x1="50" y1="23" x2="85" y2="23" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Lightning / Fast hit badge -->
  <g transform="translate(255, 65)">
    <circle cx="20" cy="20" r="18" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5"/>
    <path d="M22 8 L14 20 L21 20 L18 32 L28 18 L21 18 Z" fill="#38bdf8"/>
  </g>
  <!-- Shield / Offline badge -->
  <g transform="translate(75, 120)">
    <circle cx="18" cy="18" r="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <path d="M18 10 L26 14 V20 C26 25 18 28 18 28 C18 28 10 25 10 20 V14 Z" fill="#34d399"/>
  </g>
  <text x="200" y="200" fill="#f8fafc" font-size="14" font-family="system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle" letter-spacing="1">APP SHELL CACHE-FIRST</text>
  <text x="200" y="220" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Disponibilidad instantánea y soporte Offline</text>
</svg>
